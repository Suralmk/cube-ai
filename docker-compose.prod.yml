services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cube-ai-backend-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - API_PREFIX=api/v1
      - DATABASE_URL=postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-cube_ai}
      - QDRANT_URL=http://qdrant:6333
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - STORAGE_LOCAL_DIR=/app/storage
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_CHAT_MODEL=${OPENROUTER_CHAT_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      - OPENROUTER_EMBEDDING_MODEL=${OPENROUTER_EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
    volumes:
      - storage_prod_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - cube-prod-network

  postgres:
    image: postgres:16-alpine
    container_name: cube-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-cube_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-cube_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cube-prod-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cube-qdrant-prod
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_prod_data:/qdrant/storage
    networks:
      - cube-prod-network

volumes:
  postgres_prod_data:
  qdrant_prod_data:
  storage_prod_data:

networks:
  cube-prod-network:
    driver: bridge
